    <script>
      // Ensure window.fetch has both getter and setter so browser extensions and sandbox executors can safely hook it
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(val) {
            _fetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        try {
          const proto = Object.getPrototypeOf(window);
          if (proto) {
            let _fetch = window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get() {
                return _fetch;
              },
              set(val) {
                _fetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (err) {}
      }
    </script>
